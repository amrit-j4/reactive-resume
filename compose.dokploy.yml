name: reactive_resume

# Dokploy-ready variant of compose.yml.
# - No published host ports (Traefik routes to the app via the Domains tab).
# - Secrets come from Dokploy's Environment tab, not hardcoded.
# - Postgres/Redis/SeaweedFS stay on private networks.

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    networks:
      - data_network
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-resume}
      - POSTGRES_USER=${POSTGRES_USER:-resume}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      start_period: 10s
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7
    restart: unless-stopped
    command: redis-server --appendonly yes
    networks:
      - data_network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      start_period: 5s
      interval: 30s
      timeout: 10s
      retries: 3

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: server -s3 -filer -dir=/data -ip=0.0.0.0
    networks:
      - storage_network
    environment:
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8888"]
      start_period: 10s
      interval: 30s
      timeout: 10s
      retries: 3

  seaweedfs_create_bucket:
    image: amazon/aws-cli:latest
    restart: on-failure
    environment:
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint: >
      /bin/sh -c "
        aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket reactive-resume 2>/dev/null ||
        aws --endpoint-url http://seaweedfs:8333 s3 mb s3://reactive-resume
      "
    networks:
      - storage_network
    depends_on:
      seaweedfs:
        condition: service_healthy

  reactive_resume:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - data_network
      - storage_network
      - dokploy-network
    expose:
      - "3000"
    environment:
      - PORT=3000
      - APP_URL=${APP_URL:?set APP_URL, e.g. https://resume.example.com}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-resume}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-resume}
      - AUTH_SECRET=${AUTH_SECRET:?set AUTH_SECRET}
      - ENCRYPTION_SECRET=${ENCRYPTION_SECRET:?set ENCRYPTION_SECRET (min 32 chars)}
      - REDIS_URL=redis://redis:6379
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_REGION=us-east-1
      - S3_ENDPOINT=http://seaweedfs:8333
      - S3_BUCKET=reactive-resume
      - S3_FORCE_PATH_STYLE=true
      - FLAG_DISABLE_SIGNUPS=${FLAG_DISABLE_SIGNUPS:-false}
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      seaweedfs_create_bucket:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
  seaweedfs_data:
  app_data:

networks:
  data_network:
  storage_network:
  dokploy-network:
    external: true
